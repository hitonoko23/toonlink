<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <style>
    .title{font:700 38px sans-serif;fill:#0f172a}
    .step{font:700 24px sans-serif;fill:#1d4ed8}
    .body{font:400 20px sans-serif;fill:#0f172a}
    .box{fill:#eff6ff;stroke:#93c5fd;stroke-width:2;rx:14}
    .arrow{stroke:#2563eb;stroke-width:4;marker-end:url(#m)}
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="40" y="60" class="title">GitHubからアプリを使う手順（ZIPダウンロード）</text>

  <rect x="40" y="100" width="500" height="120" class="box"/>
  <text x="60" y="145" class="step">1) リポジトリを開く</text>
  <text x="60" y="180" class="body">ブラウザで GitHub のプロジェクトページへ</text>

  <rect x="560" y="100" width="500" height="120" class="box"/>
  <text x="580" y="145" class="step">2) Code ボタンを押す</text>
  <text x="580" y="180" class="body">緑色の「Code」ボタンをクリック</text>

  <line x1="540" y1="160" x2="560" y2="160" class="arrow"/>

  <rect x="40" y="260" width="500" height="120" class="box"/>
  <text x="60" y="305" class="step">3) Download ZIP を選ぶ</text>
  <text x="60" y="340" class="body">メニューから「Download ZIP」をクリック</text>

  <rect x="560" y="260" width="500" height="120" class="box"/>
  <text x="580" y="305" class="step">4) ZIPを解凍する</text>
  <text x="580" y="340" class="body">ダウンロード後、フォルダを展開する</text>

  <line x1="540" y1="320" x2="560" y2="320" class="arrow"/>

  <rect x="300" y="430" width="500" height="140" class="box"/>
  <text x="320" y="480" class="step">5) index.html を開く</text>
  <text x="320" y="515" class="body">解凍フォルダの index.html をダブルクリック</text>
  <text x="320" y="545" class="body">→ スライダー付きの指標アプリが起動</text>

  <line x1="290" y1="500" x2="300" y2="500" class="arrow"/>
  <line x1="800" y1="500" x2="810" y2="500" class="arrow"/>
</svg>
